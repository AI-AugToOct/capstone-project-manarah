version: "3.9"

services:
  backend:
    build:
      context: ./capstone-project-manarah-backend
      dockerfile: Dockerfile
    environment:
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_VISION=${OPENAI_MODEL_VISION:-gpt-4o}
      - OPENAI_MODEL_AUDIO=${OPENAI_MODEL_AUDIO:-whisper-1}
      - OPENAI_MODEL_REASONER=${OPENAI_MODEL_REASONER:-gpt-4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:5173}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
      - FRAME_EXTRACTION_FPS=${FRAME_EXTRACTION_FPS:-15}
      - AUTO_REMOVE_THRESHOLD=${AUTO_REMOVE_THRESHOLD:-0.85}
      - REVIEW_THRESHOLD=${REVIEW_THRESHOLD:-0.60}
      - WARNING_THRESHOLD=${WARNING_THRESHOLD:-0.40}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./capstone-project-manarah
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - PORT=4173
    ports:
      - "4173:4173"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
